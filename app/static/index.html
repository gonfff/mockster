<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockster</title>
  <link rel="icon" type="image/svg+xml" href="/mockster.svg">
  <link href="bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="custom-bg">
  <div class="container-xl header-wrap">
    <header class="header-card">
      <div class="header-left">
        <a class="brand" href="https://github.com/gonfff/mockster" target="_blank" rel="noopener noreferrer">
          <span class="brand-name">Mockster</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <span class="base-path">base path: <code>/mock</code></span>
      </div>

      <div class="header-actions">
        <button class="btn btn-brand" type="button" onclick="createModal()">Create</button>
        <button class="btn btn-outline-brand" type="button" data-bs-toggle="modal" data-bs-target="#Uploader">Import</button>
        <a class="btn btn-outline-brand" href="/management/mocks/actions/export">Export</a>
      </div>
    </header>

    <div class="search-card">
      <div class="search-form" role="search" id="search-form">
        <input class="form-control" id="search-query" name="query" type="search" placeholder="Search by mock name" aria-label="Search" oninput="searchMocks()">
      </div>
    </div>

    <section class="table-card">
      <div class="main-table">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr class="main-table-header">
              <th scope="col" class="main-table-upper-left-border">#</th>
              <th scope="col" class="my-button" onclick="orderBy('name')">Name</th>
              <th scope="col" class="my-button" onclick="orderBy('method')">Method</th>
              <th scope="col" class="my-button" onclick="orderBy('path')">Path</th>
              <th scope="col" class="my-button" onclick="orderBy('status')">Status</th>
              <th scope="col" class="main-table-upper-right-border"></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal fade" id="Uploader" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5">Import YAML</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">This action replaces all existing mocks.</p>
          <form id="fileInput">
            <input type="file" class="form-control" name="file" accept=".yaml,.yml">
            <div class="modal-footer px-0 pb-0 mt-3">
              <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-brand" data-bs-dismiss="modal" onclick="importYaml(event)">Import</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="delete-modal-container"></div>
  <div id="toast-container"></div>
  <div id="editor-modal-container"></div>

  <script src="bootstrap/bootstrap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
